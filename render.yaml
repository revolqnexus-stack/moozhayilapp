services:
  # API Service
  - type: web
    name: moozhayil-api
    runtime: node
    region: singapore  # Closest to India
    plan: starter  # $7/month
    rootDir: apps/api
    buildCommand: npm ci && npm run build && npx prisma generate
    startCommand: npm run start:prod
    healthCheckPath: /health
    
    envVars:
      # Staging preview — mock providers + fixed OTP (123456). Do NOT use
      # NODE_ENV=production here; production requires live SMS and refuses mock.
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 3080
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: PAYMENT_PROVIDER_MODE
        value: mock
      - key: STORAGE_BACKEND
        value: s3
      - key: TRUST_PROXY
        value: true
      # Mock providers until MSG91 / KYC / Firebase live keys are ready.
      - key: SMS_PROVIDER_MODE
        value: mock
      - key: KYC_PROVIDER_MODE
        value: mock
      - key: FIREBASE_MODE
        value: mock
      
      # External managed services — set in Render dashboard (not Render Postgres/Redis):
      # DATABASE_URL = Neon PostgreSQL pooler (?sslmode=require)
      # REDIS_URL    = Upstash Redis
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      
      # Secrets (add manually in Render dashboard)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OTP_HASH_SECRET
        sync: false
      - key: PII_ENCRYPTION_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: KYC_PROVIDER_BASE_URL
        sync: false
      - key: KYC_PROVIDER_API_KEY
        sync: false
      - key: KYC_WEBHOOK_SECRET
        sync: false
      - key: GOLD_RATE_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

  # Background Worker (optional)
  - type: worker
    name: moozhayil-worker
    runtime: node
    region: singapore
    plan: starter  # $7/month
    rootDir: apps/api
    buildCommand: npm ci && npm run build
    startCommand: npm run worker:start
    
    envVars:
      # Share same env vars as API
      - fromGroup: moozhayil-api

# Database: Neon PostgreSQL (external) — set DATABASE_URL in dashboard
# Cache/queue: Upstash Redis (external) — set REDIS_URL in dashboard
