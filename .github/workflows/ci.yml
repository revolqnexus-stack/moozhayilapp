name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  api:
    name: Backend (lint, typecheck, test, prod build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moozhayil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/moozhayil_test?schema=public

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/moozhayil_test?schema=public
          REDIS_URL: redis://localhost:6379
          PUBLIC_BASE_URL: http://localhost:3000

  mobile:
    name: Flutter (format, analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  admin:
    name: Admin portal (typecheck, production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://api.example.com

  docker:
    name: Docker production images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile apps/api

      - name: Build worker image
        run: docker build -f apps/api/Dockerfile.worker apps/api

      - name: Build admin image
        run: docker build -f apps/admin/Dockerfile --build-arg VITE_API_BASE=https://api.example.com apps/admin

  mobile-apk:
    name: Build Android APK
    needs: mobile
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Configure release signing (optional)
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$ANDROID_STORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > key.properties
            echo "Release signing configured from secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; building debug-signed APK."
          fi

      - name: Build release APK (arm64)
        working-directory: apps/mobile
        run: |
          API_BASE=$(jq -r '.production.apiV1' ../../config/environments.json)
          GS=android/app/google-services.json
          FB_PROJECT=$(jq -r '.project_info.project_id' "$GS")
          FB_SENDER=$(jq -r '.project_info.project_number' "$GS")
          FB_APPID=$(jq -r '.client[0].client_info.mobilesdk_app_id' "$GS")
          FB_APIKEY=$(jq -r '.client[0].api_key[0].current_key' "$GS")
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --dart-define=API_BASE_URL="$API_BASE" \
            --dart-define=PUSH_ENABLED=true \
            --dart-define=FIREBASE_PROJECT_ID="$FB_PROJECT" \
            --dart-define=FIREBASE_API_KEY="$FB_APIKEY" \
            --dart-define=FIREBASE_APP_ID="$FB_APPID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FB_SENDER"

      - name: Stage named APK
        working-directory: apps/mobile
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '[:space:]')
          SAFE_VERSION=$(echo "$VERSION" | tr '+' '-')
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../../dist/Moozhayil-prod-arm64-v${SAFE_VERSION}.apk"
          echo "APK_NAME=Moozhayil-prod-arm64-v${SAFE_VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APK_NAME }}
          generate_release_notes: true
