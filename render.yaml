# Render Blueprint — staging + production separation
# Staging: mock providers, staging Neon branch, staging Upstash Redis
# Production: live providers only; separate Neon branch + Redis; startup guards in env.ts

services:
  - type: web
    name: moozhayilapp
    runtime: docker
    region: oregon
    plan: free
    rootDir: apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 3080
      - key: TRUST_PROXY
        value: true
      - key: PAYMENT_PROVIDER_MODE
        value: mock
      - key: SMS_PROVIDER_MODE
        value: mock
      - key: KYC_PROVIDER_MODE
        value: mock
      - key: FIREBASE_MODE
        value: mock
      - key: STORAGE_BACKEND
        value: local
      - key: ENABLE_DEMO_SEEDS
        value: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OTP_HASH_SECRET
        sync: false
      - key: PII_ENCRYPTION_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: moozhayilapp-prod
    runtime: docker
    region: oregon
    plan: free
    rootDir: apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3080
      - key: TRUST_PROXY
        value: true
      - key: PAYMENT_PROVIDER_MODE
        value: live
      - key: SMS_PROVIDER_MODE
        value: live
      - key: KYC_PROVIDER_MODE
        value: live
      - key: FIREBASE_MODE
        value: live
      - key: STORAGE_BACKEND
        value: s3
      - key: ENABLE_DEMO_SEEDS
        value: false
      - key: MOOZHAYIL_STAGING_DATABASE_HOST
        sync: false
      - key: MOOZHAYIL_STAGING_REDIS_HOST
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OTP_HASH_SECRET
        sync: false
      - key: PII_ENCRYPTION_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: MSG91_DLT_PE_ID
        sync: false
      - key: MSG91_DLT_TE_ID
        sync: false
      - key: KYC_PROVIDER_BASE_URL
        sync: false
      - key: KYC_PROVIDER_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: worker
    name: moozhayil-worker-prod
    runtime: docker
    region: oregon
    plan: free
    rootDir: apps/api
    dockerCommand: npm run worker:start
    envVars:
      - fromService:
          type: web
          name: moozhayilapp-prod
          property: envVars

# External: Neon PostgreSQL (separate branches per environment)
# External: Upstash Redis (separate databases per environment)
