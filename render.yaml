services:
  # API Service
  - type: web
    name: moozhayil-api
    runtime: node
    region: singapore  # Closest to India
    plan: starter  # $7/month
    rootDir: apps/api
    buildCommand: npm ci && npm run build && npx prisma generate
    startCommand: npm run start:prod
    healthCheckPath: /health
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3080
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: PAYMENT_PROVIDER_MODE
        value: live
      - key: STORAGE_BACKEND
        value: s3
      - key: TRUST_PROXY
        value: true
      - key: SMS_PROVIDER_MODE
        value: live
      - key: KYC_PROVIDER_MODE
        value: live
      - key: FIREBASE_MODE
        value: live
      
      # Connect to managed services (add in Render dashboard)
      - key: DATABASE_URL
        fromDatabase:
          name: moozhayil-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: moozhayil-redis
          type: redis
          property: connectionString
      
      # Secrets (add manually in Render dashboard)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OTP_HASH_SECRET
        sync: false
      - key: PII_ENCRYPTION_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: KYC_PROVIDER_BASE_URL
        sync: false
      - key: KYC_PROVIDER_API_KEY
        sync: false
      - key: KYC_WEBHOOK_SECRET
        sync: false
      - key: GOLD_RATE_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

  # Background Worker (optional)
  - type: worker
    name: moozhayil-worker
    runtime: node
    region: singapore
    plan: starter  # $7/month
    rootDir: apps/api
    buildCommand: npm ci && npm run build
    startCommand: npm run worker:start
    
    envVars:
      # Share same env vars as API
      - fromGroup: moozhayil-api

# Managed PostgreSQL Database
databases:
  - name: moozhayil-db
    databaseName: moozhayil
    plan: starter  # $7/month
    region: singapore
    ipAllowList: []  # Allow all (or restrict to your IPs)

# Managed Redis (for sessions/cache/jobs)
# Note: Render doesn't have managed Redis, use Upstash instead (free)
# Add REDIS_URL manually from Upstash
